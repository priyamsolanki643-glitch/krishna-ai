<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Modern Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-2xl">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-5xl font-bold bg-gradient-to-r from-brand-400 via-blue-400 to-purple-400 bg-clip-text text-transparent mb-2">
        <i class="fas fa-layer-group mr-3"></i>TaskFlow
      </h1>
      <p class="text-slate-400 text-sm">Stay organized. Stay productive.</p>
    </header>

    <!-- Main App Container -->
    <main class="glass-panel rounded-2xl shadow-2xl shadow-brand-500/10 overflow-hidden">
      <!-- Task Input Section -->
      <div class="p-6 border-b border-slate-700/30">
        <form id="taskForm" class="flex gap-3">
          <div class="relative flex-1">
            <i class="fas fa-plus absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500"></i>
            <input 
              type="text" 
              id="taskInput" 
              placeholder="Add a new task..." 
              class="w-full bg-slate-800/50 border border-slate-700/50 text-slate-200 placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all duration-300"
              autocomplete="off"
            >
          </div>
          <button 
            type="submit" 
            class="bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-600 hover:to-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-brand-500/50 shadow-lg shadow-brand-500/25"
          >
            <i class="fas fa-check"></i>
          </button>
        </form>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center justify-between px-6 py-3 bg-slate-800/30 border-b border-slate-700/30">
        <div class="flex gap-1">
          <button class="filter-btn px-4 py-1.5 text-sm font-medium text-brand-400 border-b-2 border-brand-400 transition-all duration-200" data-filter="all">
            All
          </button>
          <button class="filter-btn px-4 py-1.5 text-sm font-medium text-slate-500 border-b-2 border-transparent hover:text-slate-300 transition-all duration-200" data-filter="active">
            Active
          </button>
          <button class="filter-btn px-4 py-1.5 text-sm font-medium text-slate-500 border-b-2 border-transparent hover:text-slate-300 transition-all duration-200" data-filter="completed">
            Completed
          </button>
        </div>
        <button 
          id="clearCompletedBtn" 
          class="text-xs text-slate-500 hover:text-red-400 transition-colors duration-200"
        >
          Clear completed
        </button>
      </div>

      <!-- Task List -->
      <div id="taskList" class="p-4 space-y-2 min-h-[300px] max-h-[400px] overflow-y-auto">
        <!-- Empty State -->
        <div id="emptyState" class="flex flex-col items-center justify-center h-full py-16 text-slate-500">
          <i class="fas fa-clipboard-list text-6xl mb-4 text-slate-600"></i>
          <p class="text-lg font-medium text-slate-400">No tasks yet</p>
          <p class="text-sm mt-1">Add a task above to get started</p>
        </div>
      </div>

      <!-- Footer -->
      <footer class="px-6 py-3 bg-slate-800/30 border-t border-slate-700/30 flex items-center justify-between text-xs text-slate-500">
        <span id="itemsLeft">0 items left</span>
        <span class="text-slate-600">TaskFlow v1.0</span>
      </footer>
    </main>

    <!-- Footer Credit -->
    <footer class="text-center mt-6 text-xs text-slate-600">
      <p>Built with <i class="fas fa-heart text-red-500/50 mx-1"></i> and modern web technologies</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
