<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corruption Watch India | Report & Visualize</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>🛡️ Corruption Watch India</h1>
      <p>Report bribery incidents securely. Track state-wise transparency data.</p>
    </div>
  </header>

  <main class="container dashboard-grid">
    <section class="card report-section">
      <h2>📝 File a Report</h2>
      <form id="bribe-form" novalidate>
        <div class="form-group">
          <label for="state">State *</label>
          <select id="state" required>
            <option value="">Select State</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Delhi">Delhi</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="West Bengal">West Bengal</option>
          </select>
          <span class="error-msg" id="state-error"></span>
        </div>

        <div class="form-group">
          <label for="department">Department/Office *</label>
          <input type="text" id="department" placeholder="e.g., RTO, Passport Office, Police Station" required>
          <span class="error-msg" id="department-error"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount Demanded (₹) *</label>
          <input type="number" id="amount" min="1" placeholder="Enter amount" required>
          <span class="error-msg" id="amount-error"></span>
        </div>

        <div class="form-group">
          <label for="date">Incident Date *</label>
          <input type="date" id="date" required>
          <span class="error-msg" id="date-error"></span>
        </div>

        <div class="form-group">
          <label for="description">Brief Description</label>
          <textarea id="description" rows="3" placeholder="Optional: Describe the incident..."></textarea>
        </div>

        <button type="submit" class="btn-primary">Submit Report</button>
        <p id="form-feedback" class="feedback-msg"></p>
      </form>
    </section>

    <section class="card map-section">
      <div class="map-header">
        <h2>🌍 State-Wise Bribe Reports</h2>
        <div class="legend">
          <span class="legend-label">Reports</span>
          <div class="legend-bar"></div>
          <div class="legend-values">
            <span>0</span>
            <span id="legend-max">0</span>
          </div>
        </div>
      </div>
      <div id="map-container" class="map-wrapper">
        <div class="loading">Loading Map Data...</div>
      </div>
      <div id="tooltip" class="tooltip hidden"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Data is stored locally in your browser for demonstration. For production, connect to a secure backend API.</p>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="script.js"></script>
</body>
</html>
