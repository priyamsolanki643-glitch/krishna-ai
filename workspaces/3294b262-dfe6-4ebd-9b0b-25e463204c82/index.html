<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content


="width=device-width, initial-scale=1.0">
  <title>CyberKanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #050505; color: #e0e0e0; }
    .col { min-height: 70vh; background: rgba(15, 15, 25, 0.7); border: 1px solid #1f2937; border-radius: 8px; backdrop-filter: blur(5px); }
    .card { background: #0f172a; border: 1px solid #00ffff; border-radius: 6px; transition: all 0.2s ease; cursor: grab; }
    .card:hover { box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); transform: translateY(-2px); }
    .neon-text { font-family: 'Orbitron', sans-serif; color: #00ffff; text-shadow: 0 0 8px rgba(0,255,255,0.6); }
    .dragging { opacity: 0.4; border-style: dashed; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="p-6 min-h-screen flex flex-col">
  <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <h1 class="text-3xl md:text-5xl neon-text tracking-widest text-center md:text-left">CYBER KANBAN</h1>
    <button onclick="addTask()" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 font-bold py-2 px-6 rounded uppercase tracking-wider transition-all neon-text">+ New Task</button>
  </header>
  
  <main class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">
    <div id="todo" class="col p-4" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2 class="text-lg font-bold mb-4 text-cyan-300 border-b border-cyan-900/50 pb-2 flex justify-between"><span>TODO</span><span id="count-todo" class="text-sm opacity-70">0</span></h2>
      <div id="todo-list" class="space-y-3"></div>
    </div>
    <div id="inprogress" class="col p-4" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2 class="text-lg font-bold mb-4 text-yellow-300 border-b border-yellow-900/50 pb-2 flex justify-between"><span>IN PROGRESS</span><span id="count-inprogress" class="text-sm opacity-70">0</span></h2>
      <div id="inprogress-list" class="space-y-3"></div>
    </div>
    <div id="done" class="col p-4" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2 class="text-lg font-bold mb-4 text-green-300 border-b border-green-900/50 pb-2 flex justify-between"><span>DONE</span><span id="count-done" class="text-sm opacity-70">0</span></h2>
      <div id="done-list" class="space-y-3"></div>
    </div>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('cyberTasks')) || [];
    
    function save() {
      localStorage.setItem('cyberTasks', JSON.stringify(tasks));
      render();
    }

    function addTask() {
      const title = prompt("Enter task title:");
      if (title && title.trim()) {
        tasks.push({ id: Date.now(), title: title.trim(), status: 'todo' });
        save();
      }
    }

    function deleteTask(id) {
      if (confirm("Delete this task?")) {
        tasks = tasks.filter(t => t.id !== id);
        save();
      }
    }

    function updateStatus(id, newStatus) {
      const task = tasks.find(t => t.id == id);
      if (task) { task.status = newStatus; save(); }
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function dragStart(ev) { 
      ev.dataTransfer.setData("text", ev.target.id); 
      ev.target.classList.add('dragging');
    }
    function dragEnd(ev) { ev.target.classList.remove('dragging'); }
    function drop(ev) {
      ev.preventDefault();
      const id = parseInt(ev.dataTransfer.getData("text"));
      const newStatus = ev.currentTarget.id;
      updateStatus(id, newStatus);
    }

    function render() {
      ['todo', 'inprogress', 'done'].forEach(status => {
        const container = document.getElementById(`${status}-list`);
        const countEl = document.getElementById(`count-${status}`);
        container.innerHTML = '';
        const filtered = tasks.filter(t => t.status === status);
        countEl.textContent = filtered.length;
        
        filtered.forEach(task => {
          const div = document.createElement('div');
          div.className = 'card p-3 flex justify-between items-center text-sm';
          div.draggable = true;
          div.id = task.id;
          div.ondragstart = dragStart;
          div.ondragend = dragEnd;
          div.innerHTML = `
            <span class="truncate mr-2 font-medium">${task.title}</span>
            <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-300 px-2 py-1 rounded hover:bg-red-900/30 transition">✕</button>
          `;
          container.appendChild(div);
        });
      });
    }

    render();
  </script>
</body>
</html>
